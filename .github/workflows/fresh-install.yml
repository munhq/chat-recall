# The fresh-machine gate: install the packed npm artifact on a pristine
# runner (Linux + macOS + Windows), index a fixture session, and boot the
# MCP server. This exact flow caught the unbundled-tarball crash that every
# unit test missed — it is the only check that exercises what a customer
# actually runs.
#
# ── Where each platform runs, and why ────────────────────────────────────────
# Linux runs on `hotmun-arc` (self-hosted ARC in the k3s cluster), so it costs
# no billed minutes and stays on EVERY push — the always-on signal.
#
# macOS and Windows have no self-hosted capacity (the ARC scale set is a single
# Linux/amd64 pool on Linux nodes), so they are the only GitHub-hosted jobs left,
# billing at ×10 and ×2 with each job rounded up to a full minute. Measured over
# 30 days they cost ~1044 billed minutes — 780 of it macOS — for ~15s of real
# work per run, because they fired on every push to main.
#
# They now run only when someone is about to ship or explicitly asks:
#   * workflow_dispatch — on demand, before you hand the tarball to anyone;
#   * a `v*` tag        — the release gate, once releases are tagged;
#   * the daily cron    — early warning that main still installs everywhere.
# A plain push to main gets Linux only.
#
# NOTE ON THE TAG TRIGGER: as of writing there is no release process — no
# version tags, no GitHub releases, and `chat-recall` is not on npm. The `v*`
# trigger is therefore dormant, deliberately: it arms itself the day you cut a
# real tag. Until then `workflow_dispatch` and the cron are the only paths that
# reach macOS/Windows, which is why the cron stays even though it costs minutes.
# Gating cross-platform coverage on tags ALONE would silently never run — the
# exact 18-day blind spot the cron was added to end.
name: Fresh-machine install gate

on:
  workflow_dispatch:
  push:
    branches: [main]      # Linux only (see the matrix expression below)
    tags: ['v*']          # release: all three platforms
  schedule:
    - cron: '0 6 * * *'   # daily, so a broken install surfaces within a day

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # A job-level `if:` cannot read the `matrix` context, so the platform
        # set is chosen here instead — `strategy` can read `github`. Everything
        # except a plain branch push gets the full matrix.
        runner: >-
          ${{ fromJSON(
                (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v'))
                && '["hotmun-arc","macos-latest","windows-latest"]'
                || '["hotmun-arc"]'
              ) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build + pack the real artifact
        run: |
          npm ci
          npm run build
          cd packages/cli && npm pack

      - name: Install globally from tarball (what a customer runs)
        # --omit=optional skips better-sqlite3 entirely: the thin collector is
        # native-module-free, so install must succeed and the CLI/MCP must run
        # even on a machine with no C++ toolchain and no prebuilt binary.
        shell: bash
        run: npm install -g --omit=optional packages/cli/chat-recall-*.tgz

      - name: Version, status, MCP boot (native-free)
        shell: bash
        run: |
          chat-recall --version
          # `status` is server-backed now; with no login it must exit non-zero
          # with a clean "not logged in" message — NOT crash on a missing native
          # module. We assert it ran without a native/module-load error.
          out="$(chat-recall status 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -qi "not logged in" || { echo "status did not produce the expected not-logged-in message"; exit 1; }
          echo "$out" | grep -qiE "better-sqlite3|MODULE_NOT_FOUND|ERR_DLOPEN" && { echo "native-module error leaked — collector is not native-free"; exit 1; }
          # MCP must boot and stay alive — portable check (GNU `timeout` is
          # missing on macOS runners and broken under Git bash on Windows)
          node .github/scripts/mcp-boot-check.cjs
          echo "fresh install OK on ${{ runner.os }}"
