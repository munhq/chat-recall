# The fresh-machine gate: install the packed npm artifact on a pristine
# runner (Linux + macOS + Windows), index a fixture session, and boot the
# MCP server. This exact flow caught the unbundled-tarball crash that every
# unit test missed — it is the only check that exercises what a customer
# actually runs.
#
# ── Where each platform runs, and why ────────────────────────────────────────
# All three platforms run on GitHub-hosted runners. This repository is public,
# and GitHub gives public repositories unlimited free minutes on standard
# runners — Linux, macOS and Windows alike. Nothing here is billed.
#
# Linux previously ran on a self-hosted ARC pool, to avoid billed minutes.
# That stopped working the moment the
# repository went public: GitHub withholds an organisation's self-hosted
# runners from public repositories, so every run queued for ever. Do not put it
# back — allowing it would let a fork's pull request execute code inside the
# production cluster.
#
# ALL THREE PLATFORMS RUN ON EVERY PUSH TO MAIN.
#
# macOS and Windows used to be gated to workflow_dispatch, a `v*` tag and a daily
# cron, on the reasoning that "Linux already catches almost everything". It does
# not. The network-error classifier walked `err.cause` alone, and on a dual-stack
# host — the default for `localhost` on macOS and Windows — undici reports the
# failure as an AggregateError whose members carry the codes. The identical
# refused connection therefore printed "connection refused" on Linux and the bare
# five characters "fetch failed" on the other two. A gate that runs tomorrow does
# not stop that being handed to a person today, and a public repository is billed
# nothing for any of the three runners.
#
# The cron stays as well: it answers "does main still install everywhere" on a
# day with no pushes, which is the 18-day blind spot it was added to end.
name: Fresh-machine install gate

on:
  workflow_dispatch:
  push:
    branches: [main]      # all three platforms
    tags: ['v*']          # release: all three platforms
  schedule:
    - cron: '0 6 * * *'   # daily, so a broken install surfaces within a day

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build + pack the real artifact
        run: |
          npm ci
          npm run build
          cd packages/cli && npm pack

      - name: Install globally from tarball (what a customer runs)
        # --omit=optional skips better-sqlite3 entirely: the thin collector is
        # native-module-free, so install must succeed and the CLI/MCP must run
        # even on a machine with no C++ toolchain and no prebuilt binary.
        shell: bash
        run: npm install -g --omit=optional packages/cli/chat-recall-*.tgz

      - name: Version, status, MCP boot (native-free)
        shell: bash
        run: |
          chat-recall --version
          # `status` is server-backed now; with no login it must exit non-zero
          # with a clean "not logged in" message — NOT crash on a missing native
          # module. We assert it ran without a native/module-load error.
          out="$(chat-recall status 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -qi "not logged in" || { echo "status did not produce the expected not-logged-in message"; exit 1; }
          echo "$out" | grep -qiE "better-sqlite3|MODULE_NOT_FOUND|ERR_DLOPEN" && { echo "native-module error leaked — collector is not native-free"; exit 1; }
          # MCP must boot and stay alive — portable check (GNU `timeout` is
          # missing on macOS runners and broken under Git bash on Windows)
          node .github/scripts/mcp-boot-check.cjs
          echo "fresh install OK on ${{ runner.os }}"

      # ── THE INSTALLED BINARY, AGAINST SERVERS THAT ANSWER BADLY ────────────
      # `--version`, `status` and an MCP boot were the whole of this gate, and
      # they are the three things a new user never types. `init`, `login` and
      # `sync` were untested here, and every install bug found on 2026-08-27 was
      # in one of them — found by a person on a laptop, all reproducible with no
      # network against a server that answers 404, HTML, 502 or nothing.
      #
      # CHAT_RECALL_TEST_CLI re-points install-hostile.test.ts, which CI already
      # runs against the built bundle, at `chat-recall` — the globally installed
      # binary from the tarball above. Same assertions, the artifact a customer
      # actually has, on all three platforms. The suite redirects every tool home
      # into a throwaway tree, so it writes nothing outside its sandbox.
      - name: init / login / sync, hostile AND happy path (installed binary)
        shell: bash
        env:
          CHAT_RECALL_TEST_CLI: chat-recall
        run: |
          # install-hostile: the failure paths — 404, HTML, 502, silence.
          # sync-happy-path: a real login + sync that must SUCCEED, against the
          # smallest conformant server, with a real transcript on disk. Until
          # this existed, nothing anywhere proved a sync can complete on macOS
          # or Windows: the only such test is compose-integration, which needs
          # Docker and therefore runs on Linux alone.
          npx vitest run \
            packages/cli/src/install-hostile.test.ts \
            packages/cli/src/sync-happy-path.test.ts
