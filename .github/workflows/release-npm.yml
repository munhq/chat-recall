# Publish the CLI to npm with Trusted Publishing (OIDC) — no token, no OTP.
#
# npm is restricting 2FA-bypass tokens for direct publishing, so a stored
# _authToken is a dead end for automation. This workflow proves its identity to
# npm with a short-lived OIDC token minted by GitHub for this repo and this
# workflow file, which is why `id-token: write` below is load-bearing.
#
# BEFORE THE FIRST RUN, configure the trusted publisher once, by hand:
#   npmjs.com → Packages → chat-recall → Settings → Trusted publishing
#   Publisher: GitHub Actions | Owner: munhq | Repo: chat-recall
#   Workflow: release-npm.yml
# That page only exists after the package has been published once, so the very
# first publish has to happen from a laptop with an --otp code. Every release
# after this is tokenless.
#
# Node 22 / npm 11.5.1 are MINIMUMS for OIDC — the rest of CI runs Node 20 and
# would fail here with a confusing auth error rather than a version error.
name: release-npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # mint the OIDC token npm verifies. Without this the
                         # publish fails as if the credentials were wrong.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 BUNDLES npm 11.x, which is all trusted publishing needs
          # (>= 11.5.1). Chosen so the workflow never upgrades npm in place.
          #
          # Two failed release runs came from trying: pinning node 22.14 with
          # `npm i -g npm@latest` hit EBADENGINE when latest moved to 12.x, and
          # pinning 22.22.2 then failed MODULE_NOT_FOUND because npm cannot
          # reliably overwrite the npm that is currently executing it. Taking
          # the bundled npm removes the whole class of problem.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'   # required: it writes the
                                                       # .npmrc that the OIDC
                                                       # exchange reads.

      # Assert rather than install. If a future runner image ships an npm too
      # old for OIDC, fail here with the reason instead of at the publish step
      # with an authentication error that looks like a credentials problem.
      - name: npm must support OIDC
        run: |
          V=$(npm --version); echo "npm $V, node $(node --version)"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);
            if (a>11 || (a===11 && (b>5 || (b===5 && c>=1)))) process.exit(0);
            console.error(`::error::npm ${process.argv[1]} is too old for trusted publishing (need >= 11.5.1)`);
            process.exit(1);' "$V"

      - run: npm ci
      - run: npm run build
      - run: npm test

      # The tag must match the version being published, or a mistyped tag ships
      # the wrong version under the right name — unfixable, since npm forbids
      # reusing a version number.
      - name: Tag must match packages/cli/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./packages/cli/package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$PKG tag=$TAG"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag v$TAG != package $PKG"; exit 1; }

      # Refuse to ship a licence we did not choose. The manifest shipped "MIT"
      # for months; publishing that once makes that version MIT forever and
      # hands anyone the right to resell it.
      - name: Licence must not be MIT
        run: |
          LIC=$(node -p "require('./packages/cli/package.json').license")
          echo "license=$LIC"
          [ "$LIC" != "MIT" ] || { echo "::error::licence is still MIT — set it before releasing"; exit 1; }

      - name: Pack (dry run)
        if: inputs.dry_run
        run: npm publish -w chat-recall --dry-run --access public

      # --provenance attests that the tarball came from this commit and this
      # workflow, which is the main reason to publish from CI at all. It requires
      # a PUBLIC repo: npm cannot verify an attestation whose source nobody can
      # read, so passing it from a private repo fails the publish outright.
      #
      # Decided at run time from the repository's own visibility rather than a
      # hand-maintained flag, so making the repo public starts producing
      # provenance with no edit here, and nobody has to remember this exists.
      - name: Publish
        if: '!inputs.dry_run'
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            echo "public repo — publishing with provenance"
            npm publish -w chat-recall --access public --provenance
          else
            echo "::warning::repo is private, publishing WITHOUT provenance — make it public to get attestations"
            npm publish -w chat-recall --access public
          fi
