# After a release: attach the Claude Desktop bundle to the GitHub Release, and
# update the Smithery listing.
#
# Smithery does not read this repository. A smithery.yaml sitting in it publishes
# nothing — the listing exists because something PUTs a release to the Platform
# API, and this one's first release was PUT by hand. That is exactly what went
# wrong: the listing sat with no description for weeks, which made it unfindable
# in search (nothing to index), and fixing it took a session of manual API calls.
# A listing published by hand describes an old version forever, so it is a
# workflow.
#
# The .mcpb bundle is built here anyway, because Smithery refuses a stdio release
# without one. It is also what Claude Desktop installs in one click, so it goes on
# the GitHub Release too — codeindex and distil already ship theirs that way, and
# a bundle that only ever reached Smithery hid the one-click install from anyone
# reading the release page.
#
# The tool card is captured from the tagged source that release-npm published.
#
# SMITHERY_API_KEY is the bearer token from smithery.ai. Without it the Release
# still gets its bundle; only the listing step warns and stops, because a stale
# listing is worse than a red tag but not worth blocking a release over.
name: smithery

# AFTER release-npm, as mcp-registry does.
#
# This used to fire on the same tag push and poll npm for ten minutes. On
# v0.7.11 release-npm took eleven: the poll gave up at 11:33:09, npm published
# at 11:34:18, and the run still finished green. The Release got no bundle and
# the listing kept describing 0.7.10. workflow_run starts this only when the
# publish has finished, and the Release object exists by then too.
on:
  workflow_run:
    workflows: ['release-npm']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # `gh release upload` of the bundle. `read` was enough while
                    # this workflow only talked to Smithery.

jobs:
  publish:
    # A manual run is always allowed. An automatic one only follows a release
    # that succeeded from a tag, because release-npm also runs dry on dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      # workflow_run checks out the default branch, whose version may already
      # be past the tag. head_branch is the tag that triggered release-npm.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # FormData and Blob in the publish script

      # The card says `npx -p chat-recall chat-recall-mcp`, so the version must
      # be on npm before anything here publishes. release-npm has finished, but
      # the registry can take a few minutes to serve a new version. If it still
      # does not, the run fails, so a missing bundle shows as a red run.
      - name: The npm version must be live
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for i in $(seq 1 45); do
            if npm view "chat-recall@$VERSION" version >/dev/null 2>&1; then
              echo "npm has $VERSION"
              exit 0
            fi
            sleep 20
          done
          echo "::error::chat-recall@$VERSION is not on npm after fifteen minutes, so nothing was published."
          echo "::error::Re-run this workflow (workflow_dispatch) once npm serves it."
          exit 1

      - name: Build the MCP server
        run: |
          npm ci
          npm run build

      # Captured by SPEAKING MCP to the built server, not by parsing source: the
      # listing then declares the tools the shipped artefact actually answers
      # with, including the lean/full profile decision.
      - name: Capture the tool card
        env:
          # A throwaway home, so the capture cannot read or write a real profile.
          CHAT_RECALL_DATA_DIR: ${{ runner.temp }}/cr-data
          CHAT_RECALL_CLAUDE_HOME: ${{ runner.temp }}/cr-claude
          CHAT_RECALL_NO_DAEMON: '1'
        run: |
          mkdir -p "$CHAT_RECALL_CLAUDE_HOME/projects"
          node scripts/smithery/capture-card.mjs --out card.json -- node packages/cli/dist/mcp.js

      - name: Build the bundle
        run: node scripts/smithery/build-mcpb.mjs --out "chat-recall-$VERSION.mcpb" --card card.json

      # release-npm cuts the Release object in its last step, so it exists here.
      - name: Attach the bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" "chat-recall-$VERSION.mcpb" --clobber
          echo "attached chat-recall-$VERSION.mcpb to v$VERSION"

      - name: Is the key present
        id: key
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "${SMITHERY_API_KEY:-}" ]; then
            echo "::warning::SMITHERY_API_KEY is not set, so the Smithery listing was NOT updated."
            echo "::warning::Add it at /settings/secrets/actions; until then the listing describes whatever version was published last."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the listing
        if: steps.key.outputs.present == 'true'
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: node scripts/smithery/publish-smithery.mjs --card card.json --bundle "chat-recall-$VERSION.mcpb"
