# PR gate that ANY contributor / fork can run — no self-hosted runners, no org
# secrets, no private registries. Typechecks, builds the bundles, and runs the
# full unit suite. This is the check a pull request must pass; the heavier
# compose-integration / cloud-image / fresh-install workflows stay push-only
# because they need infra a fork can't reach.
name: CI

# This file described itself as "the check a pull request must pass" while
# triggering on workflow_dispatch alone — so nothing ran on a PR, and nothing ran
# on a merge either. A gate that only fires when someone remembers to click it is
# not a gate; every claim in the comment above was aspirational.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a busy PR doesn't queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── THREE PLATFORMS, EVERY PUSH AND EVERY PR ───────────────────────────────
  # This job ran on ubuntu-latest alone, and the product ships to macOS and
  # Windows. The gap was not theoretical: the network-error classifier walked
  # `err.cause` only, and on a dual-stack host — which `localhost` is by default
  # on macOS and Windows — undici reports the failure as an AggregateError whose
  # members hold the codes. So a refused connection printed "connection refused"
  # on Linux CI and the bare five characters "fetch failed" on the two platforms
  # nobody tested. A unit suite that only ever runs on one OS cannot find that.
  #
  # This repository is public, so GitHub bills nothing for standard Linux, macOS
  # or Windows runners; the three run in parallel and the slowest sets the wall
  # clock. `fail-fast: false` because "it broke on Windows only" is precisely the
  # answer this matrix exists to give — cancelling the others would hide it.
  build-and-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` needs an in-sync lockfile. better-sqlite3 compiles here
      # (ubuntu-latest has a toolchain); it is a devDependency of engine/cli and
      # a dependency of server, not something the shipped CLI bundle needs — the
      # bundler's native-free guard enforces that separately.
      - name: Install
        run: npm ci

      # Typecheck every workspace (tsc -b) and produce the CLI bundles
      # (esbuild) — this is the same `npm run build` the release image runs.
      - name: Build
        run: npm run build

      # The DASHBOARD, which `npm run build` above does NOT cover: the root
      # tsc -b project references the engine, cli and server, and the React
      # client has its own tsconfig that only Vite reads. So a client type error
      # passed CI green and first appeared in the Docker image build
      # (Dockerfile.server stage 1) — a seven-minute round trip, on a job most
      # pushes do not even run. It cost exactly that: `deleteConversation(sessionId)`
      # against a `string | null` prop shipped green from here.
      # Type errors are identical on every OS, so this pays for itself once.
      - name: Typecheck the dashboard client
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/server/client
        run: npm ci && npx tsc -b --pretty false

      # Includes install-hostile.test.ts, which spawns the BUILT cli against
      # servers that answer 404/HTML/502/silence — the class of failure every
      # bug in this area belonged to, now exercised on all three platforms.
      - name: Test
        run: npx vitest run

  # ── THE POSTGRES HALF OF THE SUITE, WHICH HAD NEVER RUN IN CI ─────────────
  # `vitest.config.ts` switches the store tests to Postgres when DATABASE_URL is
  # set — and NO workflow set it. So `behaviorSuite('postgres')`, every tenant
  # isolation test and every RLS test were skipped on every run, and the only
  # Postgres coverage was compose-integration, which drives the CLI rather than
  # the store and connects as the Compose bootstrap role.
  #
  # That role is a SUPERUSER with BYPASSRLS, and PostgreSQL bypasses row-level
  # security entirely for such a role — FORCE ROW LEVEL SECURITY does not change
  # it. So even that job ran with RLS switched off. A production sync then failed
  # on every batch with
  #
  #   42501: new row violates row-level security policy "author_visibility"
  #          for table "compute_cache"
  #
  # which no test in the repository was capable of reproducing.
  #
  # rls-child-writes.test.ts creates its own NON-superuser role from this
  # connection and reconnects as that, so RLS is genuinely enforced here.
  postgres-tests:
    name: store tests against real Postgres (RLS enforced)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: chat_recall
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: chat_recall
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chat_recall"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://chat_recall:ci_only_password@127.0.0.1:5432/chat_recall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # The store suites only. The rest of the suite already runs on three
      # platforms above; re-running it here would double the bill for no signal.
      - name: Store + RLS tests
        run: npx vitest run packages/engine/src/core/store

  # Every image and video that reaches a public surface, OCR'd frame by frame.
  #
  # A grep polices generated text and can say nothing about a PNG. Screenshots
  # taken by hand carried a private project name inside an MCP list, an all-time
  # spend figure on a dashboard, and a session title that read as astroturfing.
  # None of those were visible to any text check.
  #
  # Its own job: apt-installing tesseract and ffmpeg must not slow build-and-test.
  # No private-name list in CI, so this catches profanity, money, real home
  # directories, credentials and key blocks — the rules that need no secret. The
  # name check runs locally, where the list exists.
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the OCR toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr ffmpeg
      - name: Scan every published asset
        run: node scripts/assetguard.mjs docs/media
