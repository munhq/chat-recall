# PR gate that ANY contributor / fork can run — no self-hosted runners, no org
# secrets, no private registries. Typechecks, builds the bundles, and runs the
# full unit suite. This is the check a pull request must pass; the heavier
# compose-integration / cloud-image / fresh-install workflows stay push-only
# because they need infra a fork can't reach.
name: CI

# This file described itself as "the check a pull request must pass" while
# triggering on workflow_dispatch alone — so nothing ran on a PR, and nothing ran
# on a merge either. A gate that only fires when someone remembers to click it is
# not a gate; every claim in the comment above was aspirational.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a busy PR doesn't queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` needs an in-sync lockfile. better-sqlite3 compiles here
      # (ubuntu-latest has a toolchain); it is a devDependency of engine/cli and
      # a dependency of server, not something the shipped CLI bundle needs — the
      # bundler's native-free guard enforces that separately.
      - name: Install
        run: npm ci

      # Typecheck every workspace (tsc -b) and produce the CLI bundles
      # (esbuild) — this is the same `npm run build` the release image runs.
      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run
