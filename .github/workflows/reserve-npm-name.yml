# Reserve an npm package name by publishing a placeholder, on demand.
#
# WHY THIS EXISTS
# npm's first publish of a new name cannot use Trusted Publishing (OIDC): the
# trusted-publisher setting lives on a package's settings page, and that page
# does not exist until the package does. npm's own guidance is to publish once
# with a token, then configure OIDC for every release after. See
# release-npm.yml for the OIDC path this hands over to.
#
# Running it here rather than from a laptop is deliberate. The account's second
# factor is a security key, which emits no code, so an interactive publish can
# never satisfy the registry's OTP challenge. A CI automation token carries its
# own 2FA bypass, so the registry accepts it without a human in the loop.
#
# SECRET REQUIRED: NPM_AUTOMATION_TOKEN
#   npmjs.com -> Access Tokens -> Generate New Token -> **Classic Token** ->
#   **Automation**. Granular tokens do NOT work here: they require an OTP on
#   every write unless created with the bypass option, which npm is retiring.
#   Store it at: repo -> Settings -> Secrets and variables -> Actions.
#
# The placeholder is deliberately inert — no code, and `UNLICENSED` so the
# reservation commits you to no licence. The real package ships later, under
# whatever licence you choose, through release-npm.yml.
name: reserve-npm-name

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to reserve (e.g. chat-recall)'
        required: true
        type: string
      version:
        description: 'Placeholder version'
        required: false
        default: '0.0.1'
        type: string
      dry_run:
        description: 'Build and validate the tarball without publishing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          registry-url: 'https://registry.npmjs.org'

      # Reject anything npm would reject, before we touch the registry: npm
      # names are lowercase, may not start with . or _, and are URL-safe.
      #
      # The semver guard is not paranoia — it already happened. Digits and dots
      # are legal in npm names, so a version typed into the name box ("0.0.1")
      # passed the grammar check and went on to query the registry for a package
      # called 0.0.1. It failed safe, but only by luck: had that name been free
      # we would have reserved it.
      - name: Validate the requested name
        run: |
          NAME='${{ inputs.package }}'
          VERSION='${{ inputs.version }}'
          echo "package: '$NAME'"
          echo "version: '$VERSION'"
          echo "$NAME" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,213}$' \
            || { echo "::error::'$NAME' is not a valid npm package name"; exit 1; }
          echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+' \
            && { echo "::error::'$NAME' looks like a version, not a package name — check the fields"; exit 1; }
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::version '$VERSION' is not semver"; exit 1; }
          echo "names look right"

      # A name already on the registry is either yours or someone else's; either
      # way publishing a placeholder over it is wrong, so stop.
      - name: Refuse if the name is already taken
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${{ inputs.package }}")
          echo "registry says: $CODE"
          [ "$CODE" = "404" ] || { echo "::error::'${{ inputs.package }}' already exists (HTTP $CODE)"; exit 1; }

      - name: Build the placeholder
        run: |
          mkdir -p reserve && cd reserve
          cat > package.json <<JSON
          {
            "name": "${{ inputs.package }}",
            "version": "${{ inputs.version }}",
            "description": "Cross-tool memory for AI coding sessions. Name reserved — first release coming shortly.",
            "license": "UNLICENSED",
            "homepage": "https://chatrecall.dev"
          }
          JSON
          cat > README.md <<'MD'
          # Reserved

          Cross-tool memory for AI coding sessions — Claude Code, Gemini CLI,
          Codex, OpenCode and Antigravity.

          This version is a name reservation. The first working release lands
          shortly. See https://chatrecall.dev
          MD
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'));console.log('manifest parses')"

      - name: Pack (dry run)
        if: inputs.dry_run
        working-directory: reserve
        run: npm publish --dry-run --access public

      - name: Publish
        if: '!inputs.dry_run'
        working-directory: reserve
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}

      - name: Next step
        if: '!inputs.dry_run'
        run: |
          echo "Reserved ${{ inputs.package }}@${{ inputs.version }}."
          echo "Now set the trusted publisher so releases need no token:"
          echo "  npmjs.com -> Packages -> ${{ inputs.package }} -> Settings -> Trusted publishing"
          echo "  GitHub Actions | ${{ github.repository_owner }} | ${{ github.event.repository.name }} | release-npm.yml"
