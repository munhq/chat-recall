# Chat-Recall SELF-HOST SERVER — the docker compose option for people who
# don't use the SaaS. One container: dashboard UI + API, store-only.
#
# This is NOT the local app. The local product is the native `chat-recall`
# binary (npm i -g chat-recall) — it indexes your machine and pushes redacted
# conversations here. This compose never mounts ~/.claude or your code.
#
# Quick start:
#   1. echo "ADMIN_KEY=$(openssl rand -hex 24)" >> .env
#   2. docker compose up -d --build
#   3. Mint a device token for your machine(s):
#        curl -XPOST localhost:8080/api/tenants -H "x-admin-key: $ADMIN_KEY" \
#             -H 'content-type: application/json' -d '{"slug":"me","display_name":"Me"}'
#        curl -XPOST localhost:8080/api/tenants/me/tokens -H "x-admin-key: $ADMIN_KEY" \
#             -H 'content-type: application/json' -d '{"device_id":"laptop"}'
#   4. On each machine:  chat-recall login http://<host>:8080 --token <ct_…>
#      (the watch daemon then syncs continuously; `chat-recall sync` is manual)
#   5. open http://localhost:8080
#
# Storage is a flag: SQLite (default — zero deps, lives in the data volume)
# or Postgres for teams:
#   CHAT_RECALL_STORAGE=postgres \
#   DATABASE_URL=postgres://chatrecall:chatrecall@postgres:5432/chat_recall \
#     docker compose --profile postgres up -d

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "${WEB_PORT:-8080}:5000"
    volumes:
      # Index + caches — named volume so they survive `compose down`.
      - chat_recall_data:/data
    environment:
      CHAT_RECALL_DATA_DIR: /data
      CHAT_RECALL_SERVER_MODE: server
      CHAT_RECALL_EDITION: ${CHAT_RECALL_EDITION:-selfhost}
      HOST: 0.0.0.0
      PORT: 5000
      # Required for minting device tokens; unset ⇒ those endpoints are
      # disabled (fail-closed) and the binary can never log in.
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY in .env (e.g. openssl rand -hex 24)}
      # Storage: sqlite (default, in the data volume) | postgres (teams).
      CHAT_RECALL_STORAGE: ${CHAT_RECALL_STORAGE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      # Dashboard auth: none (default; bind to localhost or your VPN!) |
      # static-token | keycloak (set OIDC_JWKS_URL / OIDC_ISSUER too).
      AUTH_PROVIDER: ${AUTH_PROVIDER:-none}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Optional: Postgres + pgvector (team storage backend) ──────────────────
  # `docker compose --profile postgres up -d` + set CHAT_RECALL_STORAGE=postgres,
  #   DATABASE_URL=postgres://chatrecall:chatrecall@postgres:5432/chat_recall
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatrecall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatrecall}
      POSTGRES_DB: ${POSTGRES_DB:-chat_recall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatrecall} -d ${POSTGRES_DB:-chat_recall}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chat_recall_data:
  postgres_data:
