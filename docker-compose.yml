# Chat-Recall — one container does everything: serves the UI + API and indexes
# your sessions in the background.
#
# Quick start (zero config, FTS keyword search, no API keys):
#   docker compose up -d
#   open http://localhost:8080
#
# Optional semantic (vector) search via local Ollama:
#   EMBEDDING_PROVIDER=ollama docker compose --profile ollama up -d
#
# Optional Postgres backend (team/cloud):
#   docker compose --profile postgres up -d   # + set CHAT_RECALL_STORAGE=postgres, DATABASE_URL

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "${WEB_PORT:-8080}:5000"
    volumes:
      # Your AI tool dirs, read-only — the index is built from these. Compose
      # expands ${HOME} (not ~), so the defaults work as-is.
      - ${CLAUDE_DIR:-${HOME}/.claude}:/root/.claude:ro
      - ${GEMINI_DIR:-${HOME}/.gemini}:/root/.gemini:ro
      - ${CODEX_DIR:-${HOME}/.codex}:/root/.codex:ro
      - ${OPENCODE_DIR:-${HOME}/.local/share/opencode}:/root/.local/share/opencode:ro
      # Index + cache.db — named volume so they survive `compose down`.
      - chat_recall_data:/data
    environment:
      CHAT_RECALL_DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 5000
      # Search backend. Default 'none' = FTS5 keyword search, zero deps/keys.
      # Set 'ollama' (+ --profile ollama) or 'gemini' (+ GEMINI_API_KEY) for vectors.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Summaries. Default 'none' = first prompt used as the title (no keys).
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Storage. sqlite (default, in the data volume) | postgres (team/cloud).
      CHAT_RECALL_STORAGE: ${CHAT_RECALL_STORAGE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      CHAT_RECALL_TENANT: ${CHAT_RECALL_TENANT:-default}
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Optional: local Ollama for semantic/vector search ─────────────────────────
  # `docker compose --profile ollama up -d` (set EMBEDDING_PROVIDER=ollama).
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Optional: Postgres + pgvector (team/cloud storage backend) ────────────────
  # `docker compose --profile postgres up -d` + set CHAT_RECALL_STORAGE=postgres,
  #   DATABASE_URL=postgres://chatrecall:chatrecall@postgres:5432/chat_recall
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatrecall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatrecall}
      POSTGRES_DB: ${POSTGRES_DB:-chat_recall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatrecall} -d ${POSTGRES_DB:-chat_recall}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chat_recall_data:
  ollama_data:
  postgres_data:
