# Chat-Recall Docker Compose
#
# Quick start:
#   cp .env.example .env          # Edit with your settings
#   docker compose up -d          # Start all services
#   open http://localhost:8080     # Web UI
#
# Profiles:
#   docker compose up -d                          # Default: starts Ollama + all services
#   docker compose --profile gpu up -d            # With GPU acceleration for Ollama
#   docker compose up -d --scale ollama=0         # Skip Ollama (use external/host Ollama)
#
# To use your host Ollama instead of the container:
#   Set OLLAMA_HOST=http://host.docker.internal:11434 in .env
#   Then: docker compose up -d --scale ollama=0

services:
  # ── Ollama: Local embedding model server ──────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      # ollama's bundled `ollama list` exits 0 when the daemon answers; the
      # image doesn't ship curl/wget so this is the cheapest probe.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Ollama with GPU support (use --profile gpu)
  ollama-gpu:
    image: ollama/ollama:latest
    profiles: [gpu]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Model init: Pull required models on first start ───────────────────
  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c '
        echo "Pulling embedding model: nomic-embed-text..."
        curl -s http://ollama:11434/api/pull -d "{\"name\": \"nomic-embed-text\"}" | tail -1
        if [ -n "${OLLAMA_SUMMARY_MODEL:-}" ]; then
          echo "Pulling summary model: ${OLLAMA_SUMMARY_MODEL}..."
          curl -s http://ollama:11434/api/pull -d "{\"name\": \"${OLLAMA_SUMMARY_MODEL}\"}" | tail -1
        fi
        echo "Models ready."
      '

  # ── Backend API server ────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      # Host AI dirs, read-only. Compose expands ${HOME} (NOT ~), so defaults work.
      - ${CLAUDE_DIR:-${HOME}/.claude}:/root/.claude:ro
      - ${GEMINI_DIR:-${HOME}/.gemini}:/root/.gemini:ro
      - ${CODEX_DIR:-${HOME}/.codex}:/root/.codex:ro
      - ${OPENCODE_DIR:-${HOME}/.local/share/opencode}:/root/.local/share/opencode:ro
      # Index + cache.db live here — named volume so they survive `compose down`.
      - chat_recall_data:/data
    environment:
      CHAT_RECALL_DATA_DIR: /data
      # Embedding
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Summaries
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_SUMMARY_MODEL:-qwen2.5:7b}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OpenAI-compatible summary provider (OpenRouter / Ollama Cloud / NVIDIA / OpenAI / custom)
      SUMMARY_API_BASE_URL: ${SUMMARY_API_BASE_URL:-}
      SUMMARY_API_MODEL: ${SUMMARY_API_MODEL:-}
      SUMMARY_API_KEY: ${SUMMARY_API_KEY:-}
      # Storage backend: sqlite (default, in chat_recall_data) | postgres (team/cloud).
      # For postgres run `docker compose --profile postgres up` and set these.
      CHAT_RECALL_STORAGE: ${CHAT_RECALL_STORAGE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      CHAT_RECALL_TENANT: ${CHAT_RECALL_TENANT:-default}
      # Server
      PORT: 5000
      HOST: 0.0.0.0
      NODE_ENV: production
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Web frontend (React + nginx) ─────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # ── Auto-indexer daemon ───────────────────────────────────────────────
  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    volumes:
      - ${CLAUDE_DIR:-${HOME}/.claude}:/root/.claude:ro
      - ${GEMINI_DIR:-${HOME}/.gemini}:/root/.gemini:ro
      - ${CODEX_DIR:-${HOME}/.codex}:/root/.codex:ro
      - ${OPENCODE_DIR:-${HOME}/.local/share/opencode}:/root/.local/share/opencode:ro
      - chat_recall_data:/data
    environment:
      CHAT_RECALL_DATA_DIR: /data
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_SUMMARY_MODEL:-qwen2.5:7b}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUMMARY_API_BASE_URL: ${SUMMARY_API_BASE_URL:-}
      SUMMARY_API_MODEL: ${SUMMARY_API_MODEL:-}
      SUMMARY_API_KEY: ${SUMMARY_API_KEY:-}
      CHAT_RECALL_STORAGE: ${CHAT_RECALL_STORAGE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      CHAT_RECALL_TENANT: ${CHAT_RECALL_TENANT:-default}
      NODE_ENV: production
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "packages/cli/auto-indexer/indexer.ts"]

  # ── Postgres + pgvector (team/cloud storage backend) ──────────────────
  # Opt-in: `docker compose --profile postgres up`. Then set in .env:
  #   CHAT_RECALL_STORAGE=postgres
  #   DATABASE_URL=postgres://chatrecall:chatrecall@postgres:5432/chat_recall
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatrecall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatrecall}
      POSTGRES_DB: ${POSTGRES_DB:-chat_recall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatrecall} -d ${POSTGRES_DB:-chat_recall}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
    # Persists Ollama models between restarts
  chat_recall_data:
  postgres_data:
    # Persists the Postgres (team/cloud) backend between restarts
    # Persists the search index + cache.db (CHAT_RECALL_DATA_DIR=/data)
