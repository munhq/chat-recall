<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090D14" />
    <!-- The dashboard shipped with no icon at all, so every tab was blank and
         a pinned tab was unidentifiable. SVG first because it adapts to the tab
         strip's theme; the mark is the same one the marketing site uses, so the
         two surfaces are not two products. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Don't leak the path (which can contain a repo/project id) to any
         cross-origin destination via the Referer header. Same-origin keeps the
         full URL so internal navigation/analytics are unaffected. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- The two faces that render before anything else: body copy and the
         display face used by the header and every metric. They are discovered
         late otherwise, because a font inside an @import'd stylesheet cannot be
         requested until index.css has been fetched AND parsed. crossorigin is
         required even same-origin — fonts are always fetched in CORS mode, and
         omitting it downloads the file twice. Only the `latin` subsets are
         preloaded; latin-ext loads on demand for the characters that need it. -->
    <link rel="preload" href="/fonts/hanken-grotesk-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/martian-mono-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Pre-paint theme bootstrap. Mirrors the TopBar toggle exactly:
         'light' → data-theme="light" on <html>; anything else → attribute
         absent (dark default). Runs before first paint so a persisted light
         theme doesn't flash dark and revert on reload. -->
    <script>
      try {
        if (localStorage.getItem('cr-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* storage blocked — keep dark default */ }
    </script>
    <title>chat-recall — one memory across every AI coding tool</title>
    <!-- SPA shell: everything below #root is rendered by JavaScript, so a
         crawler or a non-executing agent sees only this head and the fallback
         in the body. Those are therefore the only place the install command can
         live for a reader that cannot run scripts. Keep both in step with
         /llms.txt, which carries the longer version. -->
    <!-- Google switched Gemini CLI off and the backend went with it. This line
         kept naming it to anyone who shared a link or read the page without
         running it, so it names Cursor, which the product reads. -->
    <meta name="description" content="chat-recall indexes your Claude Code, Cursor, Codex, OpenCode and Antigravity sessions into one searchable history and exposes it to your agent over MCP. Install with: npx chat-recall init" />
    <!-- NO CANONICAL. Every URL this document is served at answers
         X-Robots-Tag: noindex (see util/static-routing.ts), and a noindex page
         that also claims a canonical asks a crawler to treat the claimed
         address as real. It claimed /app, which robots.txt disallowed, so
         nothing could fetch the page the claim pointed at. The indexable
         description of this product is the marketing build's, at the origin
         root. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="chat-recall" />
    <meta property="og:title" content="chat-recall — one memory across every AI coding tool" />
    <meta property="og:description" content="One searchable history across Claude Code, Cursor, Codex, OpenCode and Antigravity, exposed to your agent over MCP." />
    <meta property="og:url" content="https://chatrecall.dev/" />
    <!-- This document is what a signed-in person copies out of the address bar.
         It declared twitter:card=summary and no image, so every such link
         rendered as a bare URL while all nineteen marketing pages rendered a
         full card. The URL is absolute because a self-hosted build serves no
         marketing assets, where a relative path answers 404. -->
    <meta property="og:image" content="https://chatrecall.dev/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="chat-recall: use your AI conversations as your own database" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="chat-recall — one memory across every AI coding tool" />
    <meta name="twitter:description" content="One searchable history across Claude Code, Cursor, Codex, OpenCode and Antigravity, exposed to your agent over MCP." />
    <meta name="twitter:image" content="https://chatrecall.dev/og-card.png" />
    <meta name="twitter:image:alt" content="chat-recall: use your AI conversations as your own database" />
    <!-- NO JSON-LD here. This page carried its own SoftwareApplication node
         with no @id, a description of its own and a single $0 offer, while the
         marketing build declares https://chatrecall.dev/#app with six offers.
         One product, one description of it, on the pages that get indexed. -->
  </head>
  <body>
    <noscript>
      <h1>chat-recall</h1>
      <p>One memory across every AI coding tool. This page needs JavaScript, but you do not need this page to use it.</p>
      <h2>Install</h2>
      <pre>npx chat-recall init</pre>
      <p>That indexes the transcripts your AI tools already wrote to disk, detects which tools you have, and registers the MCP server so your agent can search its own history.</p>
      <p>Full machine-readable instructions: <a href="/llms.txt">/llms.txt</a> &middot; Source: <a href="https://github.com/munhq/chat-recall">github.com/munhq/chat-recall</a></p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
