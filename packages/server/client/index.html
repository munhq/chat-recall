<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090D14" />
    <!-- Don't leak the path (which can contain a repo/project id) to any
         cross-origin destination via the Referer header. Same-origin keeps the
         full URL so internal navigation/analytics are unaffected. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- The two faces that render before anything else: body copy and the
         display face used by the header and every metric. They are discovered
         late otherwise, because a font inside an @import'd stylesheet cannot be
         requested until index.css has been fetched AND parsed. crossorigin is
         required even same-origin — fonts are always fetched in CORS mode, and
         omitting it downloads the file twice. Only the `latin` subsets are
         preloaded; latin-ext loads on demand for the characters that need it. -->
    <link rel="preload" href="/fonts/hanken-grotesk-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/martian-mono-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Pre-paint theme bootstrap. Mirrors the TopBar toggle exactly:
         'light' → data-theme="light" on <html>; anything else → attribute
         absent (dark default). Runs before first paint so a persisted light
         theme doesn't flash dark and revert on reload. -->
    <script>
      try {
        if (localStorage.getItem('cr-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* storage blocked — keep dark default */ }
    </script>
    <title>Chat Recall - Claude Code Conversations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
