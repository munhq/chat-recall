<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090D14" />
    <!-- Don't leak the path (which can contain a repo/project id) to any
         cross-origin destination via the Referer header. Same-origin keeps the
         full URL so internal navigation/analytics are unaffected. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- The two faces that render before anything else: body copy and the
         display face used by the header and every metric. They are discovered
         late otherwise, because a font inside an @import'd stylesheet cannot be
         requested until index.css has been fetched AND parsed. crossorigin is
         required even same-origin — fonts are always fetched in CORS mode, and
         omitting it downloads the file twice. Only the `latin` subsets are
         preloaded; latin-ext loads on demand for the characters that need it. -->
    <link rel="preload" href="/fonts/hanken-grotesk-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/martian-mono-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Pre-paint theme bootstrap. Mirrors the TopBar toggle exactly:
         'light' → data-theme="light" on <html>; anything else → attribute
         absent (dark default). Runs before first paint so a persisted light
         theme doesn't flash dark and revert on reload. -->
    <script>
      try {
        if (localStorage.getItem('cr-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* storage blocked — keep dark default */ }
    </script>
    <title>chat-recall — one memory across every AI coding tool</title>
    <!-- This document is the SPA shell: everything below #root is rendered by
         JavaScript, so a crawler or an AI agent that fetches this URL sees only
         what is in <head> plus the <noscript> below. That is not hypothetical —
         an agent asked to "install this" from /app got the title and nothing
         else, and had no way to learn the install command. Hence the
         description, the structured data and the noscript: they are the only
         content a non-executing fetcher can read. -->
    <meta name="description" content="chat-recall indexes your Claude Code, Gemini CLI, Codex, OpenCode and Antigravity sessions into one searchable history and exposes it to your agent over MCP. Install with: npx chat-recall init" />
    <link rel="canonical" href="https://chatrecall.dev/app" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="chat-recall — one memory across every AI coding tool" />
    <meta property="og:description" content="One searchable history across Claude Code, Gemini CLI, Codex, OpenCode and Antigravity, exposed to your agent over MCP." />
    <meta property="og:url" content="https://chatrecall.dev/" />
    <meta name="twitter:card" content="summary" />
    <!-- Machine-readable install instructions. schema.org/SoftwareApplication is
         what search engines and assistants look for to answer "how do I install
         this"; the free-form llms.txt at the site root carries the longer
         agent runbook. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "chat-recall",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "macOS, Linux, Windows",
      "description": "Indexes Claude Code, Gemini CLI, Codex, OpenCode and Antigravity sessions into one searchable history, exposed to AI agents over MCP.",
      "url": "https://chatrecall.dev/",
      "downloadUrl": "https://www.npmjs.com/package/chat-recall",
      "softwareHelp": "https://chatrecall.dev/llms.txt",
      "installUrl": "https://www.npmjs.com/package/chat-recall",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
  </head>
  <body>
    <noscript>
      <h1>chat-recall</h1>
      <p>One memory across every AI coding tool. This page needs JavaScript, but you do not need this page to use it.</p>
      <h2>Install</h2>
      <pre>npx chat-recall init</pre>
      <p>That indexes the transcripts your AI tools already wrote to disk, detects which tools you have, and registers the MCP server so your agent can search its own history.</p>
      <p>Full machine-readable instructions: <a href="/llms.txt">/llms.txt</a> &middot; Source: <a href="https://github.com/munhq/chat-recall">github.com/munhq/chat-recall</a></p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
