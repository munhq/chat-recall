<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="chat-recall">
  <!-- Three strokes enter, one leaves: several AI tools writing separate
       transcripts, joined into one history. That is the product's whole claim,
       and it is the one thing no other tool in this category does — which is why
       the mark is this and not a brain. A brain says "AI memory", the category,
       and every competitor already uses it; rendered at 16px it is also an
       indistinct blob.

       Geometry chosen against the pixel grid, verified by rendering. The inlets
       sit at y=7/16/25 so three strokes stay separable at 16px, where each is
       about 1.7px. Narrower spacing merged the outer two into the stem, and a
       4-unit stroke lost the third line entirely. -->
  <style>
    .tile { fill: #A8491D }
    .mark { stroke: #FFFFFF }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #F5A97F }
      .mark { stroke: #1A0E06 }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <g class="mark" fill="none" stroke-width="3.4" stroke-linecap="round">
    <path d="M7 7h4c3.5 0 3.5 9 7 9"/>
    <path d="M7 16h11"/>
    <path d="M7 25h4c3.5 0 3.5-9 7-9"/>
    <path d="M18 16h7"/>
  </g>
</svg>
