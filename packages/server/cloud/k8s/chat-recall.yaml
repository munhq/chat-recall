# chat-recall cloud — deploy to the K3s GPU cluster via ArgoCD.
# Commit this directory to the GitOps repo (k8s_gpu/ansible/argocd/manifests/chat-recall/)
# and point an ArgoCD Application at it. Conventions match the cluster:
# Traefik ingress, local-path storage, ArgoCD sync.
#
# BEFORE DEPLOY, replace placeholders:
#   - image:      <REGISTRY>/chat-recall-cloud:<TAG>   (build from cloud/Dockerfile, push)
#   - host:       chat-recall.<YOUR_DOMAIN>            (under the existing wildcard cert)
#   - the two passwords in the Secrets (use sealed-secrets / vault, not plaintext, in real GitOps)
---
apiVersion: v1
kind: Namespace
metadata:
  name: chat-recall
---
apiVersion: v1
kind: Secret
metadata:
  name: chat-recall-db
  namespace: chat-recall
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_super"     # superuser (migrations only)
  APP_PASSWORD: "CHANGE_ME_app"            # app_user (RLS-bound, NOBYPASSRLS)
  # full URLs the workloads consume
  MIGRATE_DATABASE_URL: "postgres://postgres:CHANGE_ME_super@chat-recall-pg:5432/chat-recall"
  DATABASE_URL: "postgres://app_user:CHANGE_ME_app@chat-recall-pg:5432/chat-recall"
---
apiVersion: v1
kind: Secret
metadata:
  name: chat-recall-api
  namespace: chat-recall
type: Opaque
stringData:
  ADMIN_KEY: "CHANGE_ME_admin"             # gate for tenant/token creation
---
# ── Postgres (shared, per-tenant via RLS) — local-path PVC ───────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chat-recall-pg
  namespace: chat-recall
spec:
  serviceName: chat-recall-pg
  replicas: 1
  selector: { matchLabels: { app: chat-recall-pg } }
  template:
    metadata: { labels: { app: chat-recall-pg } }
    spec:
      # local-path volumes are node-pinned; the GPU workers autoscale away and
      # take the volume's node with them. Pin Postgres to the stable
      # control-plane nodes (which don't scale down) so its data survives.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: chat-recall }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: chat-recall-db, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "chat-recall"] }
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: chat-recall-pg
  namespace: chat-recall
spec:
  selector: { app: chat-recall-pg }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# ── Migration Job (ArgoCD PreSync hook) ──────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: chat-recall-migrate
  namespace: chat-recall
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ghcr-secret }]
      containers:
        - name: migrate
          image: ghcr.io/munhq/chat-recall-cloud:v1
          command: ["node", "migrate.mjs"]
          envFrom: [{ secretRef: { name: chat-recall-db } }]
---
# ── Sync API ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-recall-api
  namespace: chat-recall
spec:
  replicas: 2
  selector: { matchLabels: { app: chat-recall-api } }
  template:
    metadata: { labels: { app: chat-recall-api } }
    spec:
      imagePullSecrets: [{ name: ghcr-secret }]
      containers:
        - name: api
          image: ghcr.io/munhq/chat-recall-cloud:v1
          ports: [{ containerPort: 8080 }]
          envFrom:
            - { secretRef: { name: chat-recall-db } }
            - { secretRef: { name: chat-recall-api } }
          env: [{ name: PORT, value: "8080" }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: chat-recall-api
  namespace: chat-recall
spec:
  selector: { app: chat-recall-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
# ── Traefik ingress (TLS via the existing wildcard cert) ─────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chat-recall-api
  namespace: chat-recall
spec:
  entryPoints: ["websecure"]
  routes:
    - match: Host(`chat-recall.app.munhq.com`)
      kind: Rule
      services:
        - name: chat-recall-api
          port: 80
  tls:
    secretName: app-munhq-wildcard-tls
